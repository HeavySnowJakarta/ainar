name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

      - name: Copy frontend to embed directory
        run: cp -r web/dist/* internal/webui/dist/

      - name: Run Go tests
        run: go test -v ./...

      - name: Build binary
        run: go build -o ainar ./cmd/ainar

      - name: Test CLI commands
        run: |
          ./ainar version
          ./ainar --help
          ./ainar provider --help
          ./ainar key --help
          ./ainar alias --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Lint frontend
        run: cd web && npm run lint

      - name: Go vet
        run: |
          cd web && npm run build
          cp -r dist/* ../internal/webui/dist/
          cd ..
          go vet ./...
